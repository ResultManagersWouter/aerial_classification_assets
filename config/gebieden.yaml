# Analysegebieden in Rijksdriehoek (EPSG:28992), volgorde xmin, ymin, xmax, ymax.
#
# De middelpunten komen uit de locatieserver van PDOK, het vlak is er als rechthoek
# omheen gelegd. Dezelfde vlakken staan als polygon in gebieden.geojson, handig om ze
# in QGIS te bekijken of mee te geven met --grens.
#
# Draaien:  python main.py --gebied centrum_dam
# Overzicht: python -m luchtfoto_objecten gebieden
#
# Begin klein. Een vlak van 400 bij 350 meter is op zoom 15 ruim tweehonderd tegels en
# draait in een halve minuut; centrum_volledig is ruim achtduizend tegels.
#
# Alle gebieden liggen binnen de gemeente Amsterdam. Buiten de gemeentegrens levert de
# beheerkaart niets op en blijft het analysevlak leeg.

